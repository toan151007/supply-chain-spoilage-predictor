<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nền tảng quản trị chuỗi cung ứng chống lãng phí cho chuỗi cửa hàng bán lẻ và F&B."
    />
    <title>FreshChain — Quản trị chuỗi cung ứng</title>

    <!-- Apply the saved theme before React mounts so the page never flashes. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('scsp_theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* localStorage can be unavailable in private mode; fall back to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
